name: Audit TikTok Product Flow

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/audit-product-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit-product-flow.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/audit-product-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit-product-flow.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build obrigatório
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

  live-product-test:
    name: Teste externo TikTok Shop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test real TikTok Shop product
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TIKTOK_ACTOR_ID: ${{ secrets.APIFY_TIKTOK_ACTOR_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/audit-product-flow.ts

  production-diagnostic:
    name: Diagnóstico produção Lovable
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Wait for Lovable sync and test Apify
        shell: bash
        run: |
          set -u
          URL="https://tiktokfactory.lovable.app/api/public/tiktok-diagnostic"
          rm -f diagnostic.json

          for attempt in $(seq 1 24); do
            echo "Tentativa ${attempt}/24"
            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 190 \
              --output diagnostic.json \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "HTTP ${http_code}"
            if [ -f diagnostic.json ]; then
              cat diagnostic.json
              echo
            fi

            if [ "$http_code" = "200" ]; then
              node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('diagnostic.json', 'utf8'));
          console.log('RESUMO_DIAGNOSTICO=' + JSON.stringify({
            ambiente: data.ambiente,
            ok: data.resultado?.ok,
            status: data.resultado?.status,
            fonte: data.resultado?.fonte,
            product_id: data.resultado?.product_id,
            region: data.resultado?.region,
            nome: data.resultado?.nome,
            preco: data.resultado?.preco,
            campos_preenchidos: data.resultado?.campos_preenchidos,
          }));
          process.exit(data.resultado?.ok === true ? 0 : 2);
          NODE
              exit $?
            fi

            sleep 25
          done

          echo "O endpoint de diagnóstico não ficou disponível dentro do prazo."
          exit 1

      - name: Upload diagnostic response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-production-diagnostic
          path: diagnostic.json
          if-no-files-found: ignore
          retention-days: 3

name: Audit TikTok Product Flow

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/audit-product-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit-product-flow.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/audit-product-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit-product-flow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build obrigatório
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

  live-product-test:
    name: Teste externo TikTok Shop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test real TikTok Shop product
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TIKTOK_ACTOR_ID: ${{ secrets.APIFY_TIKTOK_ACTOR_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -z "${APIFY_TOKEN:-}" ]; then
            echo "APIFY_TOKEN não está configurado no GitHub; o teste externo foi ignorado."
            echo "A validação real será feita pelo job Diagnóstico produção Lovable."
            exit 0
          fi

          npx --yes tsx scripts/audit-product-flow.ts

  production-diagnostic:
    name: Diagnóstico produção Lovable
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Lovable sync and validate Apify
        shell: bash
        run: |
          set -u
          HEALTH_URL="https://tiktokfactory.lovable.app/api/public/apify-health"
          PRODUCT_URL="https://tiktokfactory.lovable.app/api/public/tiktok-diagnostic"
          rm -f apify-health.json diagnostic.json

          health_ready=false
          for attempt in $(seq 1 24); do
            echo "Saúde Apify — tentativa ${attempt}/24"
            health_code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 30 \
              --output apify-health.json \
              --write-out "%{http_code}" \
              "$HEALTH_URL" || true)

            echo "HTTP saúde ${health_code}"
            if [ -s apify-health.json ]; then
              cat apify-health.json
              echo
            fi

            if [ "$health_code" = "200" ]; then
              node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('apify-health.json', 'utf8'));
          if (data.ok !== true || data.conectado !== true) process.exit(2);
          console.log('APIFY_HEALTH=' + JSON.stringify({
            ok: data.ok,
            conectado: data.conectado,
            modo: data.modo,
            status_apify: data.status_apify,
          }));
          NODE
              if [ $? -eq 0 ]; then
                health_ready=true
                break
              fi
            fi

            sleep 25
          done

          if [ "$health_ready" != "true" ]; then
            echo "A conexão Apify não ficou disponível no ambiente publicado dentro do prazo."
            if [ -s apify-health.json ]; then
              cp apify-health.json diagnostic.json
            else
              printf '{"diagnostico":"apify_health","ok":false,"conectado":false,"erro":"endpoint_indisponivel"}\n' > diagnostic.json
            fi
            exit 1
          fi

          echo "Conexão Apify confirmada. Executando teste real do produto."
          product_code=$(curl \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --output diagnostic.json \
            --write-out "%{http_code}" \
            "$PRODUCT_URL" || true)

          echo "HTTP produto ${product_code}"
          if [ -s diagnostic.json ]; then
            cat diagnostic.json
            echo
          fi

          if [ "$product_code" != "200" ]; then
            echo "O endpoint do produto retornou HTTP ${product_code}."
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('diagnostic.json', 'utf8'));
          console.log('RESUMO_DIAGNOSTICO=' + JSON.stringify({
            ambiente: data.ambiente,
            ok: data.resultado?.ok,
            status: data.resultado?.status,
            fonte: data.resultado?.fonte,
            product_id: data.resultado?.product_id,
            region: data.resultado?.region,
            nome: data.resultado?.nome,
            preco: data.resultado?.preco,
            campos_preenchidos: data.resultado?.campos_preenchidos,
          }));
          process.exit(data.resultado?.ok === true ? 0 : 2);
          NODE

      - name: Record diagnostic result
        if: always()
        shell: bash
        run: |
          if [ ! -s diagnostic.json ]; then
            printf '{"diagnostico":"tiktok_shop_apify","resultado":{"ok":false,"status":"endpoint_indisponivel"},"registrado_em":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > diagnostic.json
          fi

          cp diagnostic.json /tmp/tiktok-production-diagnostic.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs
          cp /tmp/tiktok-production-diagnostic.json docs/last-production-diagnostic.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/last-production-diagnostic.json

          if git diff --cached --quiet; then
            echo "Diagnóstico sem alterações."
            exit 0
          fi

          git commit -m "chore: record production diagnostic [skip ci]"
          git push origin main

      - name: Upload diagnostic responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-production-diagnostic
          path: |
            apify-health.json
            diagnostic.json
          if-no-files-found: ignore
          retention-days: 3

name: Audit TikTok Product Flow

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/audit-product-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit-product-flow.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/audit-product-flow.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/audit-product-flow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build obrigatório
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

  live-product-test:
    name: Teste externo TikTok Shop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test real TikTok Shop product
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_TIKTOK_ACTOR_ID: ${{ secrets.APIFY_TIKTOK_ACTOR_ID }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/audit-product-flow.ts

  production-diagnostic:
    name: Diagnóstico produção Lovable
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test live and preview deployments
        shell: bash
        run: |
          set -u
          PROJECT="ebb821a3-43ea-4852-994f-a202351aebcc"
          PATH_DIAGNOSTIC="/api/public/tiktok-diagnostic"
          rm -f diagnostic.json

          urls=(
            "https://id-preview-f2439d57--${PROJECT}.lovable.app${PATH_DIAGNOSTIC}"
            "https://id-preview-ba0f4ea5--${PROJECT}.lovable.app${PATH_DIAGNOSTIC}"
            "https://id-preview-413b29e5--${PROJECT}.lovable.app${PATH_DIAGNOSTIC}"
            "https://tiktokfactory.lovable.app${PATH_DIAGNOSTIC}"
          )

          for URL in "${urls[@]}"; do
            echo "TESTANDO_URL=${URL}"
            http_code=$(curl \
              --silent \
              --show-error \
              --location \
              --max-time 190 \
              --output diagnostic.json \
              --write-out "%{http_code}" \
              "$URL" || true)

            echo "HTTP=${http_code}"
            if [ "$http_code" = "200" ]; then
              cat diagnostic.json
              echo
              node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('diagnostic.json', 'utf8'));
          console.log('RESUMO_DIAGNOSTICO=' + JSON.stringify({
            ambiente: data.ambiente,
            ok: data.resultado?.ok,
            status: data.resultado?.status,
            mensagem: data.resultado?.mensagem,
            detalhe: data.resultado?.detalhe,
            fonte: data.resultado?.fonte,
            product_id: data.resultado?.product_id,
            region: data.resultado?.region,
            nome: data.resultado?.nome,
            preco: data.resultado?.preco,
            campos_preenchidos: data.resultado?.campos_preenchidos,
          }));
          process.exit(data.resultado?.ok === true ? 0 : 2);
          NODE
              exit $?
            fi

            echo "RESPOSTA_PARCIAL:"
            head -c 1200 diagnostic.json 2>/dev/null || true
            echo
          done

          echo "Nenhuma implantação contém o endpoint de diagnóstico."
          exit 1

      - name: Record diagnostic result
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ ! -s diagnostic.json ]; then
            printf '{"diagnostico":"tiktok_shop_apify","resultado":{"ok":false,"status":"endpoint_indisponivel"},"registrado_em":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > diagnostic.json
          fi

          cp diagnostic.json /tmp/tiktok-production-diagnostic.json
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p docs
          cp /tmp/tiktok-production-diagnostic.json docs/last-production-diagnostic.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/last-production-diagnostic.json

          if git diff --cached --quiet; then
            echo "Diagnóstico sem alterações."
            exit 0
          fi

          git commit -m "chore: record production diagnostic [skip ci]"
          git push origin main

      - name: Upload diagnostic response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-production-diagnostic
          path: diagnostic.json
          if-no-files-found: ignore
          retention-days: 3
